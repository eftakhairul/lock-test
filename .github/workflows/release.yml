name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check test1 lock
        id: lock
        uses: eftakhairul/center-lock/check@main
        with:
          key: test1
          token: ${{ secrets.CENTER_LOCK_TOKEN }}

      - name: Release
        if: steps.lock.outputs.locked != 'true'
        run: echo "Released successfully"

      - name: Release cancelled
        if: steps.lock.outputs.locked == 'true'
        run: echo "Release cancelled"
